# Copy to bestyet.ini (kept out of git; chmod 600 on the host) and point the
# BESTYET_CONFIG environment variable at it.

[django]
# Generate with:
#   python -c "from django.core.management.utils import get_random_secret_key as k; print(k())"
secret_key =
# false in production; only set true for local development
debug = false
allowed_hosts = bestyet.example.com
csrf_trusted_origins = https://bestyet.example.com
# Admin is served at /<admin_path>/; pick something non-obvious
admin_path = admin

[paths]
# Relative paths resolve against the repo root; use absolute paths in production
db = var/bestyet.sqlite3
media = var/media
