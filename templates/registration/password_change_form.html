{% extends "base.html" %}

{% block title %}Change password - BestYet{% endblock %}

{% block content %}
<h1 class="mb-6 mt-8 text-2xl font-bold">Change password</h1>
<form method="post" class="flex flex-col gap-4">
  {% csrf_token %}
  {{ form.as_div }}
  <button type="submit"
          class="min-h-11 rounded-lg bg-zinc-900 px-4 py-2 font-semibold text-white dark:bg-zinc-100 dark:text-zinc-900">
    Change password
  </button>
</form>
{% endblock %}
