# Test-only configuration. The secret key here is a dummy value for the test
# suite and is never used in any deployed environment.
[django]
secret_key = test-only-insecure-key
debug = false
allowed_hosts = testserver, localhost
csrf_trusted_origins = https://testserver
admin_path = hidden-admin

[paths]
db = var/test.sqlite3
media = var/test-media
