[project]
name = "bestyet"
version = "0.1.0"
description = "Self-hosted, mobile-first gym logging web app"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "django-axes>=8.0",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S106", "S107"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
